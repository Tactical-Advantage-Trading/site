<section class="menu menu-fix" id="menu">
  <nav>
    <div class="menu-container">
      <ul class="desktop-menu list-inline mb-0" id="desktop-menu">
        {{ $page := . }}
        {{ range .Site.Menus.main }}
        {{ $isCurrent := $page.IsMenuCurrent "main" . }}
        <li
          class="menu-item hvr-underline-from-left{{ if $isCurrent }} active{{ end }}"
        >
          <a
            href="{{ .URL }}"
            {{ if $isCurrent }}aria-current="page"{{ end }}
            >{{ .Name }}</a
          >
        </li>
        {{ end }}
      </ul>
    </div>
  </nav>
</section>
